# Rigenera i CSV leggibili ogni volta che il log editoriale viene aggiornato.
#
# Il file data/LOG_editoriale_AI.xlsx resta l'unico da caricare a mano: conserva i
# menu a tendina che vincolano i campi a vocabolario chiuso. I CSV in data/csv/ sono
# una vista, e li scrive questo workflow — non vanno modificati a mano.
#
# Si può anche lanciare a mano dalla scheda Actions del repository ("Run workflow").

name: CSV dal log

on:
  push:
    branches: [main]
    paths:
      - 'data/*.xlsx'
      - 'scripts/xlsx_to_csv.py'
      - '.github/workflows/csv-dal-log.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rigenera:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa la libreria per leggere l'xlsx
        run: pip install --quiet openpyxl

      - name: Rigenera i CSV
        run: python3 scripts/xlsx_to_csv.py

      - name: Registra le modifiche, se ce ne sono
        run: |
          if git diff --quiet -- data/csv; then
            echo "I CSV erano già allineati al log: niente da registrare."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/csv
          git commit -m "Riallinea i CSV al log editoriale

          Vista leggibile rigenerata automaticamente da data/LOG_editoriale_AI.xlsx
          con scripts/xlsx_to_csv.py. L'xlsx resta l'originale su cui si lavora."
          git push
          echo "CSV riallineati e registrati."
